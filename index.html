<script>
    let toastTimeout;

    function showDevToast() {
        const toast = document.getElementById('devToast');
        
        // إزالة الفئة فوراً وإعادة تهيئتها لضمان إعادتها في كل ضغطة
        toast.classList.remove('show');
        void toast.offsetWidth; // إجبار المتصفح على تحديث الواجهة (Reflow)
        
        toast.classList.add('show');

        // إلغاء أي مؤقت سابق وإعادة ضبط الـ 3 ثوانٍ
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
            toast.classList.remove('show');
        }, 3000);
    }
</script>
