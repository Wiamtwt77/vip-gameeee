<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المحكمة السرية - صراع السمعة والبطاقات</title>
    <style>
        :root {
            --bg-dark: #080a10;
            --bg-card: #111625;
            --bg-accent: #1a2136;
            --primary: #f1c40f;
            --primary-dark: #b7950b;
            --danger: #e74c3c;
            --success: #2ecc71;
            --info: #3498db;
            --text-main: #ecf0f1;
            --text-muted: #8a95a5;
            --border: #28334e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--bg-card);
            border-radius: 14px;
            border: 1px solid var(--border);
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            position: relative;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 12px;
        }

        h1 { color: var(--primary); font-size: 2rem; }
        .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-top: 4px; }

        .hidden { display: none !important; }

        /* PASS DEVICE OVERLAY */
        .overlay-screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(5, 7, 12, 0.98);
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
            text-align: center;
        }

        .overlay-btn {
            background: var(--primary);
            color: #000;
            padding: 16px 32px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
        }

        /* CARD STYLES */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
            margin: 15px 0;
        }

        .game-card {
            background: var(--bg-accent);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .game-card:hover, .game-card.selected {
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .game-card.selected { background: #252e4a; outline: 2px solid var(--primary); }

        .risk-badge {
            position: absolute;
            top: 10px; left: 10px;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: bold;
        }

        .risk-low { background: #27ae60; color: #fff; }
        .risk-med { background: #e67e22; color: #fff; }
        .risk-high { background: #c0392b; color: #fff; }

        .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
        label { font-weight: bold; color: var(--primary); font-size: 0.95rem; }

        input, select, textarea, button {
            padding: 12px; border-radius: 6px; border: 1px solid var(--border);
            background: var(--bg-accent); color: var(--text-main); font-size: 0.95rem;
        }

        button { background: var(--primary); color: #000; font-weight: bold; cursor: pointer; border: none; }
        button:hover { background: var(--primary-dark); }

        .status-bar {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--bg-accent); padding: 12px 18px; border-radius: 8px;
            margin-bottom: 20px; border: 1px solid var(--border);
        }

        .player-rep-list {
            display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px;
        }

        .rep-tag {
            background: #141c2e; border: 1px solid var(--border);
            padding: 6px 12px; border-radius: 20px; font-size: 0.85rem;
        }

        .event-box {
            background: #2b1d0c; border: 1px solid #e67e22;
            padding: 16px; border-radius: 8px; margin-top: 15px;
            color: #f39c12; text-align: center;
        }

        .evidence-box {
            background: #0d1b2a; border: 1px solid var(--info);
            padding: 16px; border-radius: 8px; margin-bottom: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>المحكمة السرية</h1>
        <p class="subtitle">صراع السمعة، المخاطرة، والتحالفات المكتومة</p>
    </header>

    <!-- OVERLAY PASS DEVICE -->
    <div id="overlay" class="overlay-screen hidden">
        <h2 id="overlayTitle" style="color:var(--primary); font-size:1.8rem;">تمرير الجوال</h2>
        <p id="overlaySub" style="margin-top:10px; color:var(--text-muted);">سلم الجهاز للمشارك المستهدف وواجه الشاشة عنه</p>
        <button class="overlay-btn" onclick="UI.hideOverlay()">أنا جاهز، فتح الشاشة</button>
    </div>

    <!-- SETUP PANEL -->
    <div id="setupPanel">
        <div class="form-group">
            <label>عدد اللاعبين (3 - 6):</label>
            <input type="number" id="playerCount" min="3" max="6" value="3">
        </div>
        <div id="playerInputs"></div>
        <button id="startBtn" style="width:100%; padding:14px; margin-top:10px;">بدء المعركة</button>
    </div>

    <!-- GAME PANEL -->
    <div id="gamePanel" class="hidden">
        <div class="status-bar">
            <span>الجولة: <span id="roundNum">1</span></span>
            <span>المرحلة: <span id="phaseName" style="color:var(--primary)">-</span></span>
            <span>الدور الحالي: <span id="activePlayer" style="color:var(--primary); font-weight:bold;">-</span></span>
        </div>

        <div class="player-rep-list" id="repList"></div>

        <div id="phaseContent"></div>
    </div>
</div>

<script>
/**
 * DECK & GAME ENGINE
 */
const CARD_DATABASE = [
    { id: 'cd1', name: 'تمويل غامض', risk: 'low', desc: 'تضيف +2 نقطة سمعة لرصيدك بسرية.', effect: 'GAIN_REP' },
    { id: 'cd2', name: 'تسريب مستندات', risk: 'med', desc: 'تترك أثراً يربط استثمار هدفك بالشبهات.', effect: 'LEAK' },
    { id: 'cd3', name: 'تدمير سمعة', risk: 'high', desc: 'تخصم 3 نقاط من هدفك مباشرة وتزيد احتمال ظهور اسمك في القرائن!', effect: 'DAMAGE' },
    { id: 'cd4', name: 'عقد تحالف سري', risk: 'low', desc: 'تفتح صندوق تواصل سري مع لاعب محدد.', effect: 'ALLIANCE' },
    { id: 'cd5', name: 'تأمين أصول', risk: 'med', desc: 'تحميك من خسارة نقاط السمعة في التصويت الخاطئ لهذه الجولة.', effect: 'SHIELD' }
];

const WILD_EVENTS = [
    { name: 'أزمة اقتصادية', desc: 'تم خصم 2 نقطة سمعة من صاحب أعلى رصيد نقاط!', action: 'MINUS_TOP' },
    { name: 'عفو عام', desc: 'إضافة 1 نقطة سمعة لجميع اللاعبين دون استثناء.', action: 'ADD_ALL' },
    { name: 'تفتيش مفاجئ', desc: 'خصم 2 نقطة من كل لاعب يمتلك تحالفاً قائماً!', action: 'MINUS_ALLIES' },
    { name: 'انتعاش السوق', desc: 'إضافة 2 نقطة لأقل لاعب امتلاكاً للسمعة.', action: 'ADD_LOWEST' }
];

const GameState = {
    round: 1,
    phase: 'DRAW_ACTION',
    players: [],
    activePlayerIndex: 0,
    alliances: [], // [{p1, p2}]
    allianceMessages: [], // [{from, to, text}]
    roundSecretActions: [],
    selectedCardId: null,
    votes: {},

    reset() {
        this.round = 1;
        this.players = [];
        this.activePlayerIndex = 0;
        this.alliances = [];
        this.allianceMessages = [];
        this.roundSecretActions = [];
        this.votes = {};
    }
};

const UI = {
    setupPanel: document.getElementById('setupPanel'),
    gamePanel: document.getElementById('gamePanel'),
    playerCountInput: document.getElementById('playerCount'),
    playerInputsDiv: document.getElementById('playerInputs'),
    startBtn: document.getElementById('startBtn'),
    phaseContent: document.getElementById('phaseContent'),
    overlay: document.getElementById('overlay'),

    init() {
        this.renderPlayerInputs();
        this.playerCountInput.addEventListener('change', () => this.renderPlayerInputs());
        this.startBtn.addEventListener('click', () => this.startGame());
    },

    renderPlayerInputs() {
        const count = parseInt(this.playerCountInput.value);
        this.playerInputsDiv.innerHTML = '';
        for (let i = 1; i <= count; i++) {
            this.playerInputsDiv.innerHTML += `
                <div class="form-group">
                    <label>لاعب ${i}:</label>
                    <input type="text" class="player-name-input" value="لاعب ${i}">
                </div>
            `;
        }
    },

    startGame() {
        GameState.reset();
        const inputs = document.querySelectorAll('.player-name-input');
        inputs.forEach((inp, idx) => {
            GameState.players.push({
                id: `p_${idx+1}`,
                name: inp.value.trim() || `لاعب ${idx+1}`,
                rep: 10,
                hand: []
            });
        });

        this.setupPanel.classList.add('hidden');
        this.gamePanel.classList.remove('hidden');
        this.startRound();
    },

    showOverlay(title, sub, callback) {
        document.getElementById('overlayTitle').innerText = title;
        document.getElementById('overlaySub').innerText = sub;
        this.overlay.classList.remove('hidden');
        this.onOverlayConfirm = callback;
    },

    hideOverlay() {
        this.overlay.classList.add('hidden');
        if (this.onOverlayConfirm) this.onOverlayConfirm();
    },

    renderRepList() {
        const repDiv = document.getElementById('repList');
        repDiv.innerHTML = GameState.players.map(p => `
            <div class="rep-tag">
                👤 ${p.name}: <strong style="color:var(--primary);">${p.rep} ن</strong>
            </div>
        `).join('');
    },

    startRound() {
        // Draw 1-3 random cards for each player
        GameState.players.forEach(p => {
            const count = Math.floor(Math.random() * 3) + 1; // 1 to 3 cards
            p.hand = [];
            for (let i = 0; i < count; i++) {
                const randomCard = CARD_DATABASE[Math.floor(Math.random() * CARD_DATABASE.length)];
                p.hand.push({ ...randomCard, uniqueId: Math.random().toString() });
            }
        });

        GameState.phase = 'ACTION';
        GameState.activePlayerIndex = 0;
        this.promptPlayerTurn();
    },

    promptPlayerTurn() {
        const player = GameState.players[GameState.activePlayerIndex];
        this.showOverlay(
            `دور اللاعب: ${player.name}`,
            `يرجى تسليم الجهاز إلى (${player.name}) وإخفاء الشاشة عن باقي الحضور.`,
            () => this.renderActionPhase()
        );
    },

    renderActionPhase() {
        this.renderRepList();
        const player = GameState.players[GameState.activePlayerIndex];
        document.getElementById('roundNum').innerText = GameState.round;
        document.getElementById('phaseName').innerText = 'الأفعال والبطاقات السرية';
        document.getElementById('activePlayer').innerText = player.name;

        const otherPlayers = GameState.players.filter(p => p.id !== player.id);

        // Check active alliances for messaging
        const myAlliances = GameState.alliances.filter(a => a.p1 === player.id || a.p2 === player.id);
        let allyChatHTML = '';

        if (myAlliances.length > 0) {
            allyChatHTML = `
                <div style="background:#0e1726; border:1px solid var(--info); padding:12px; border-radius:8px; margin-top:15px;">
                    <h4 style="color:var(--info);">💬 صندوق التواصل السري للمتحالفين:</h4>
                    <div class="form-group" style="margin-top:8px;">
                        <label>اختر حليفك:</label>
                        <select id="chatTarget">
                            ${myAlliances.map(a => {
                                const allyId = a.p1 === player.id ? a.p2 : a.p1;
                                const allyName = GameState.players.find(p => p.id === allyId)?.name;
                                return `<option value="${allyId}">${allyName}</option>`;
                            }).join('')}
                        </select>
                    </div>
                    <div class="form-group">
                        <textarea id="chatText" rows="2" placeholder="اكتب رسالة سرية لحليفك..."></textarea>
                    </div>
                </div>
            `;
        }

        this.phaseContent.innerHTML = `
            <div style="background:var(--bg-accent); padding:16px; border-radius:8px; border-right:4px solid var(--primary);">
                <h3>بطاقاتك المتاحة لهذه الجولة (${player.hand.length}):</h3>
                <p style="color:var(--text-muted); font-size:0.85rem; margin-top:4px;">اختر بطاقة واحدة لاستخدامها أو تخطى الدور:</p>

                <div class="cards-grid">
                    ${player.hand.map(c => `
                        <div class="game-card" id="card_${c.uniqueId}" onclick="UI.selectCard('${c.uniqueId}')">
                            <span class="risk-badge risk-${c.risk}">خطر: ${c.risk === 'low' ? 'منخفض' : c.risk === 'med' ? 'متوسط' : 'عالي'}</span>
                            <h4 style="color:var(--primary); margin-top:15px;">${c.name}</h4>
                            <p style="font-size:0.85rem; color:var(--text-main); margin-top:6px;">${c.desc}</p>
                        </div>
                    `).join('')}
                </div>

                <div class="form-group">
                    <label>الهدف المعني بالتأثير (إن وجد):</label>
                    <select id="actionTarget">
                        ${otherPlayers.map(p => `<option value="${p.id}">${p.name}</option>`).join('')}
                    </select>
                </div>

                ${allyChatHTML}

                <button onclick="UI.submitAction()" style="width:100%; margin-top:15px; padding:12px;">تنفيذ الإجراء وإنهاء الدور</button>
            </div>
        `;
    },

    selectCard(uniqueId) {
        document.querySelectorAll('.game-card').forEach(el => el.classList.remove('selected'));
        const target = document.getElementById(`card_${uniqueId}`);
        if (target) {
            target.classList.add('selected');
            GameState.selectedCardId = uniqueId;
        }
    },

    submitAction() {
        const player = GameState.players[GameState.activePlayerIndex];
        const targetId = document.getElementById('actionTarget')?.value;
        const chatText = document.getElementById('chatText')?.value.trim();
        const chatTarget = document.getElementById('chatTarget')?.value;

        // Process Private Chat
        if (chatText && chatTarget) {
            GameState.allianceMessages.push({ from: player.id, to: chatTarget, text: chatText });
        }

        // Process Card Action
        if (GameState.selectedCardId) {
            const card = player.hand.find(c => c.uniqueId === GameState.selectedCardId);
            if (card) {
                GameState.roundSecretActions.push({
                    actorId: player.id,
                    targetId: targetId,
                    card: card
                });

                // Apply immediate mechanics if alliance card
                if (card.effect === 'ALLIANCE') {
                    GameState.alliances.push({ p1: player.id, p2: targetId });
                }
            }
        }

        GameState.selectedCardId = null;
        GameState.activePlayerIndex++;

        if (GameState.activePlayerIndex >= GameState.players.length) {
            this.startDiscussionAndEvidencePhase();
        } else {
            this.promptPlayerTurn();
        }
    },

    async startDiscussionAndEvidencePhase() {
        GameState.phase = 'DISCUSSION';
        this.renderRepList();
        document.getElementById('phaseName').innerText = 'النقاش وتقاطع الأدلة العامة';
        document.getElementById('activePlayer').innerText = 'الجميع';

        this.phaseContent.innerHTML = `
            <div style="text-align:center; padding:40px;">
                <h3 style="color:var(--primary);">جاري استخراج الشبهات والأدلة...</h3>
            </div>
        `;

        // Request soft clues from AI
        const rawPayload = {
            round: GameState.round,
            players: GameState.players.map(p => ({ id: p.id, name: p.name, rep: p.rep })),
            secretActions: GameState.roundSecretActions
        };

        let evidenceData = await this.fetchAIEvidences(rawPayload);

        let cluesHTML = evidenceData.clues.map(c => `
            <div class="evidence-box">
                <p style="font-size:1rem; line-height:1.5;">🔍 <strong>دليل عام:</strong> ${c}</p>
            </div>
        `).join('');

        this.phaseContent.innerHTML = `
            <div style="background:var(--bg-accent); padding:18px; border-radius:8px;">
                <h3 style="color:var(--primary); margin-bottom:12px;">تقرير أدلة الجولة:</h3>
                ${cluesHTML}
                <p style="color:var(--text-muted); font-size:0.85rem; margin-top:10px;">
                    تناقشوا فيما بينكم! كشوفات السمعة والأدلة تشير إلى خصائص ومؤشرات عامة دون حتمية قاطعة.
                </p>
                <button onclick="UI.startVotingPhase()" style="width:100%; margin-top:20px; padding:14px;">الانتقال للتصويت والتضحية بالنقاط</button>
            </div>
        `;
    },

    async fetchAIEvidences(payload) {
        try {
            const res = await fetch('/api/game', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ rawData: payload })
            });
            if (!res.ok) throw new Error();
            return await res.json();
        } catch {
            // Local fallback for soft clues
            return {
                clues: [
                    "شوهدت تحركات مالية ترتبط بطفيف من النقاط لدى أحد أصحاب السمعة العالية.",
                    "تم استخدام بطاقة ذات مستوى خطر مرتفع ترك أثراً أضر باستقرار الأصول."
                ]
            };
        }
    },

    startVotingPhase() {
        GameState.phase = 'VOTING';
        GameState.activePlayerIndex = 0;
        GameState.votes = {};
        this.promptVoteTurn();
    },

    promptVoteTurn() {
        const player = GameState.players[GameState.activePlayerIndex];
        this.showOverlay(
            `تصويت اللاعب: ${player.name}`,
            `تنبيه: التصويت يستلزم استثمار 2 نقطة من سمعتك! لو خطأ تفقدها.`,
            () => this.renderVotePhase()
        );
    },

    renderVotePhase() {
        this.renderRepList();
        const player = GameState.players[GameState.activePlayerIndex];
        document.getElementById('phaseName').innerText = 'التصويت واستثمار النقاط';
        document.getElementById('activePlayer').innerText = player.name;

        const otherPlayers = GameState.players.filter(p => p.id !== player.id);

        this.phaseContent.innerHTML = `
            <div style="background:var(--bg-accent); padding:18px; border-radius:8px;">
                <h3 style="color:var(--danger);">⚖️ قرار التصويت السري</h3>
                <p style="margin-top:6px; font-size:0.9rem; color:var(--text-muted);">
                    رصيدك الحالي: <strong>${player.rep} نقطة</strong>. سيتم اقتطاع <strong>2 نقطة</strong> كرهان استثمار.
                </p>

                <div class="form-group" style="margin-top:15px;">
                    <label>من تتهمه بكونه مصدر الضرر في هذه الجولة؟</label>
                    <select id="voteTarget">
                        ${otherPlayers.map(p => `<option value="${p.id}">${p.name}</option>`).join('')}
                    </select>
                </div>

                <button onclick="UI.submitVote()" style="width:100%; margin-top:15px; padding:12px;">اعتماد الصوت والتضحية بـ 2 نقطة</button>
            </div>
        `;
    },

    submitVote() {
        const player = GameState.players[GameState.activePlayerIndex];
        const targetId = document.getElementById('voteTarget').value;

        GameState.votes[player.id] = targetId;

        GameState.activePlayerIndex++;
        if (GameState.activePlayerIndex >= GameState.players.length) {
            this.resolveRoundResults();
        } else {
            this.promptVoteTurn();
        }
    },

    resolveRoundResults() {
        GameState.phase = 'RESULT';
        this.renderRepList();
        document.getElementById('phaseName').innerText = 'نتائج الجولة والحدث المفاجئ';

        // Count votes
        const tally = {};
        Object.values(GameState.votes).forEach(t => tally[t] = (tally[t] || 0) + 1);

        let maxVotes = 0;
        let accusedId = null;
        for (let t in tally) {
            if (tally[t] > maxVotes) { maxVotes = tally[t]; accusedId = t; }
        }

        const accusedPlayer = GameState.players.find(p => p.id === accusedId);

        // Apply Vote consequences (Minus 2 for wrong voters, Refund/Bonus for correct)
        GameState.players.forEach(p => {
            const votedFor = GameState.votes[p.id];
            if (votedFor === accusedId) {
                p.rep += 1; // Correct vote: Get back investment + 1 bonus
            } else {
                p.rep = Math.max(0, p.rep - 2); // Wrong vote: Lose 2 points
            }
        });

        // Trigger Wild Event
        const randomEvent = WILD_EVENTS[Math.floor(Math.random() * WILD_EVENTS.length)];
        this.applyWildEvent(randomEvent);

        this.renderRepList();

        this.phaseContent.innerHTML = `
            <div style="background:var(--bg-accent); padding:20px; border-radius:8px; text-align:center;">
                <h2>نتيجة الاقتراع</h2>
                <p style="margin-top:10px; font-size:1.1rem;">
                    تم إدانة المشارك: <strong style="color:var(--danger);">${accusedPlayer ? accusedPlayer.name : 'لا أحد'}</strong> 
                    بأغلبية (${maxVotes}) أصوات.
                </p>

                <div class="event-box">
                    <h3>💥 حدث عشوائي مفاجئ: ${randomEvent.name}</h3>
                    <p style="margin-top:6px;">${randomEvent.desc}</p>
                </div>

                <button onclick="UI.nextRound()" style="width:100%; margin-top:20px; padding:14px;">الانتقال للجولة التالية ➔</button>
            </div>
        `;
    },

    applyWildEvent(event) {
        if (event.action === 'ADD_ALL') {
            GameState.players.forEach(p => p.rep += 1);
        } else if (event.action === 'MINUS_TOP') {
            let maxRep = -1;
            GameState.players.forEach(p => { if (p.rep > maxRep) maxRep = p.rep; });
            GameState.players.forEach(p => { if (p.rep === maxRep) p.rep = Math.max(0, p.rep - 2); });
        } else if (event.action === 'ADD_LOWEST') {
            let minRep = 999;
            GameState.players.forEach(p => { if (p.rep < minRep) minRep = p.rep; });
            GameState.players.forEach(p => { if (p.rep === minRep) p.rep += 2; });
        } else if (event.action === 'MINUS_ALLIES') {
            GameState.alliances.forEach(a => {
                const p1 = GameState.players.find(p => p.id === a.p1);
                const p2 = GameState.players.find(p => p.id === a.p2);
                if (p1) p1.rep = Math.max(0, p1.rep - 1);
                if (p2) p2.rep = Math.max(0, p2.rep - 1);
            });
        }
    },

    nextRound() {
        GameState.round++;
        GameState.roundSecretActions = [];
        GameState.votes = {};
        this.startRound();
    }
};

window.addEventListener('DOMContentLoaded', () => UI.init());
</script>
