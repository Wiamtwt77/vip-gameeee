<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لعبة برا السالفة</title>
    <style>
        body { font-family: sans-serif; text-align: center; background-color: #f4f4f9; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        button { padding: 10px 20px; cursor: pointer; background: #28a745; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>لعبة برا السالفة 🕵️</h1>
    <div id="app" class="card">
        <input type="number" id="playerCount" placeholder="عدد اللاعبين">
        <button onclick="startGame()">بدء اللعبة</button>
    </div>
    <div id="gameArea" style="display:none;">
        <h2 id="message">مرر الهاتف للاعب التالي</h2>
        <button id="actionBtn" onclick="nextPlayer()">عرض كلمتي</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
