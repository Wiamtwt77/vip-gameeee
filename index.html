<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المحكمة السرية - لعبة الغموض والدبلوماسية</title>
    <style>
        :root {
            --bg-dark: #0f111a;
            --bg-card: #1a1d2e;
            --bg-accent: #252a44;
            --primary: #c9a050;
            --primary-hover: #e5b860;
            --danger: #e74c3c;
            --success: #2ecc71;
            --text-main: #f0f2f5;
            --text-muted: #95a5a6;
            --border: #2d3250;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        header {
            text-align: center;
            margin-bottom: 24px;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 16px;
        }

        h1 {
            color: var(--primary);
            font-size: 2rem;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .setup-panel, .game-panel {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .hidden {
            display: none !important;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-weight: bold;
            color: var(--primary);
        }

        input, select, textarea, button {
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg-accent);
            color: var(--text-main);
            font-size: 1rem;
        }

        input:focus, select:focus, textarea:focus {
            outline: 2px solid var(--primary);
        }

        button {
            background: var(--primary);
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
        }

        button:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        button:disabled {
            background: var(--border);
            color: var(--text-muted);
            cursor: not-allowed;
            transform: none;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-accent);
            padding: 12px 16px;
            border-radius: 8px;
            font-weight: bold;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        @media (max-width: 600px) {
            .grid-2 { grid-template-columns: 1fr; }
        }

        .card-box {
            background: var(--bg-accent);
            padding: 16px;
            border-radius: 8px;
            border-right: 4px solid var(--primary);
        }

        .secret-banner {
            background: #2a1b1b;
            border: 1px solid var(--danger);
            color: #ff8888;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            text-align: center;
            margin-bottom: 12px;
        }

        .log-box {
            background: #11131f;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px;
            max-height: 200px;
            overflow-y: auto;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .badge {
            background: var(--primary);
            color: #000;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
        }

        .player-turn-header {
            background: var(--bg-accent);
            border: 1px solid var(--primary);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary);
        }

        .vote-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            background: var(--bg-accent);
            border-radius: 6px;
            margin-bottom: 6px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>المحكمة السرية</h1>
        <p class="subtitle">لعبة الغموض والدبلوماسية والاستنتاج الاستراتيجي</p>
    </header>

    <!-- SETUP PANEL -->
    <div id="setupPanel" class="setup-panel">
        <div class="form-group">
            <label for="playerCount">عدد اللاعبين (3 - 6):</label>
            <input type="number" id="playerCount" min="3" max="6" value="3">
        </div>
        <div id="playerInputs" class="form-group">
            <!-- Player name inputs generated dynamically -->
        </div>
        <button id="startBtn">بدء اللعبة الجديدة</button>
    </div>

    <!-- GAME PANEL -->
    <div id="gamePanel" class="game-panel hidden">
        <div class="status-bar">
            <span>الجولة: <span id="roundNum">1</span></span>
            <span>المرحلة: <span id="phaseName" class="badge">الدبلوماسية</span></span>
            <span>اللاعب الحالي: <span id="activePlayer" style="color:var(--primary)">-</span></span>
        </div>

        <div id="phaseContent">
            <!-- Dynamic Phase Content UI -->
        </div>
    </div>
</div>

<script>
/**
 * ARCHITECTURE & ENGINE MODULES (SINGLE FILE SYSTEM)
 */

// 1. GAME STATE MANAGEMENT
const GameState = {
    round: 1,
    phase: 'DIPLOMACY', // DIPLOMACY, ACTION, ANALYSIS, DISCUSSION, VOTING, RESULT
    players: [],
    activePlayerIndex: 0,
    alliances: [], // [{from, to}]
    privateMessages: [], // [{from, to, text}]
    roundSecretActions: [], // [{actorId, actionType, targetId, cardId}]
    persistentSecrets: [], // Unrevealed actions carried over
    caseData: null, // Generated by AI Engine
    votes: {}, // {voterId: targetId}
    
    reset() {
        this.round = 1;
        this.phase = 'DIPLOMACY';
        this.players = [];
        this.activePlayerIndex = 0;
        this.alliances = [];
        this.privateMessages = [];
        this.roundSecretActions = [];
        this.persistentSecrets = [];
        this.caseData = null;
        this.votes = {};
    }
};

// CARD DEFINITIONS (ABSTRACT MECHANICS)
const CARDS = [
    { id: 'c1', name: 'تحقيق سري', type: 'INSPECT', desc: 'كشف جزء من تحالفات لاعب آخر.' },
    { id: 'c2', name: 'تحالف ظلي', type: 'ALLIANCE', desc: 'اقتراح حلف سري يمنح حماية متبادلة.' },
    { id: 'c3', name: 'تسريب مستندات', type: 'LEAK', desc: 'إعادة توجيه والشبهات نحو هدف آخر.' },
    { id: 'c4', name: 'تجميد أصول', type: 'SABOTAGE', desc: 'إعاقة خيارات هدفك في الجولة.' }
];

// 2. SERVERLESS AI BRIDGE
async function callAIEngine(abstractPayload) {
    try {
        const response = await fetch('/api/game', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ rawData: abstractPayload })
        });
        if (!response.ok) throw new Error("API call failed");
        return await response.json();
    } catch (err) {
        console.warn("Serverless API offline, running fallback dynamic Engine", err);
        return fallbackLocalAnalysis(abstractPayload);
    }
}

// Zero-Template Dynamic Local Logic Engine (Strictly No Fixed Cases)
function fallbackLocalAnalysis(data) {
    const actorsCount = data.players.length;
    const secrets = data.secretActions;
    
    let suspectTarget = "مجهول";
    let clueDetails = "لوحظت تحركات غير منتظمة في أروقة المحكمة.";
    
    if (secrets.length > 0) {
        const primaryAction = secrets[0];
        const actorObj = data.players.find(p => p.id === primaryAction.actorId);
        const targetObj = data.players.find(p => p.id === primaryAction.targetId);
        suspectTarget = targetObj ? targetObj.name : "أحد الأعضاء";
        
        clueDetails = `تم رصد نشاط غير عادي مرتبط بـ (${suspectTarget}) عقب مرحلة القرارات السرية، مع وجود وثائق غير مكتملة حول العملية.`;
    }

    return {
        title: `قضية الجولة ${data.round}: الشبهة الغامضة حول ${suspectTarget}`,
        publicEvidence: clueDetails,
        privateLeaks: data.players.map(p => ({
            playerId: p.id,
            hint: `معلومة خاصة لـ ${p.name}: تم التقاط إشارات عن تحالفات أو تحركات مستترة تخص النطاق التنفيذي.`
        })),
        solvabilityEvaluation: {
            isSolvable: true,
            suspicionBalance: "متوازن"
        }
    };
}

// 3. UI ENGINE & CONTROLLERS
const UI = {
    setupPanel: document.getElementById('setupPanel'),
    gamePanel: document.getElementById('gamePanel'),
    playerCountInput: document.getElementById('playerCount'),
    playerInputsDiv: document.getElementById('playerInputs'),
    startBtn: document.getElementById('startBtn'),
    phaseContent: document.getElementById('phaseContent'),

    init() {
        this.renderPlayerInputs();
        this.playerCountInput.addEventListener('change', () => this.renderPlayerInputs());
        this.startBtn.addEventListener('click', () => this.startGame());
    },

    renderPlayerInputs() {
        const count = parseInt(this.playerCountInput.value);
        this.playerInputsDiv.innerHTML = '';
        for (let i = 1; i <= count; i++) {
            this.playerInputsDiv.innerHTML += `
                <div class="form-group">
                    <label>اسم اللاعب ${i}:</label>
                    <input type="text" class="player-name-input" value="لاعب ${i}">
                </div>
            `;
        }
    },

    startGame() {
        GameState.reset();
        const inputs = document.querySelectorAll('.player-name-input');
        inputs.forEach((inp, idx) => {
            GameState.players.push({
                id: `p_${idx+1}`,
                name: inp.value.trim() || `لاعب ${idx+1}`,
                cards: [...CARDS]
            });
        });

        this.setupPanel.classList.add('hidden');
        this.gamePanel.classList.remove('hidden');
        this.startPhaseDiplomacy();
    },

    updateHeader() {
        document.getElementById('roundNum').innerText = GameState.round;
        document.getElementById('phaseName').innerText = this.getPhaseArabic(GameState.phase);
        const currPlayer = GameState.players[GameState.activePlayerIndex];
        document.getElementById('activePlayer').innerText = currPlayer ? currPlayer.name : '-';
    },

    getPhaseArabic(p) {
        const map = {
            'DIPLOMACY': 'الدبلوماسية والرسائل',
            'ACTION': 'الأفعال السرية',
            'ANALYSIS': 'تحليل الذكاء الاصطناعي',
            'DISCUSSION': 'النقاش والأدلة',
            'VOTING': 'التصويت السري',
            'RESULT': 'النتائج'
        };
        return map[p] || p;
    },

    // PHASE 1: DIPLOMACY
    startPhaseDiplomacy() {
        GameState.phase = 'DIPLOMACY';
        GameState.activePlayerIndex = 0;
        this.renderDiplomacyTurn();
    },

    renderDiplomacyTurn() {
        this.updateHeader();
        const player = GameState.players[GameState.activePlayerIndex];
        const otherPlayers = GameState.players.filter(p => p.id !== player.id);

        this.phaseContent.innerHTML = `
            <div class="secret-banner">⚠️ شاشة خاصة بـ (${player.name}) - لا تجعل الآخرين يرون خياراتك!</div>
            <div class="player-turn-header">دور اللاعب: ${player.name}</div>
            <div class="card-box">
                <h3>إرسال رسالة خاصة / اقتراح تحالف</h3>
                <div class="form-group" style="margin-top:10px;">
                    <label>اختر المستلم:</label>
                    <select id="msgTarget">
                        ${otherPlayers.map(p => `<option value="${p.id}">${p.name}</option>`).join('')}
                    </select>
                </div>
                <div class="form-group" style="margin-top:10px;">
                    <label>الرسالة السرية:</label>
                    <textarea id="msgText" rows="2" placeholder="اكتب عرضك السري هنا..."></textarea>
                </div>
                <button onclick="UI.handleSendDiplomacy()" style="margin-top:10px; width:100%;">تأكيد وإرسال الرسالة</button>
            </div>
            <button onclick="UI.nextDiplomacyPlayer()" style="margin-top:10px; width:100%; background:var(--bg-accent); border:1px solid var(--primary);">تخطي / إنهاء الدور</button>
        `;
    },

    handleSendDiplomacy() {
        const player = GameState.players[GameState.activePlayerIndex];
        const targetId = document.getElementById('msgTarget').value;
        const text = document.getElementById('msgText').value.trim();

        if (text) {
            GameState.privateMessages.push({ from: player.id, to: targetId, text });
            GameState.alliances.push({ from: player.id, to: targetId });
        }
        this.nextDiplomacyPlayer();
    },

    nextDiplomacyPlayer() {
        GameState.activePlayerIndex++;
        if (GameState.activePlayerIndex >= GameState.players.length) {
            this.startPhaseAction();
        } else {
            this.renderDiplomacyTurn();
        }
    },

    // PHASE 2: SECRET ACTIONS
    startPhaseAction() {
        GameState.phase = 'ACTION';
        GameState.activePlayerIndex = 0;
        this.renderActionTurn();
    },

    renderActionTurn() {
        this.updateHeader();
        const player = GameState.players[GameState.activePlayerIndex];
        const otherPlayers = GameState.players.filter(p => p.id !== player.id);

        this.phaseContent.innerHTML = `
            <div class="secret-banner">⚠️ سرية مطلقة: اختر بطاقتك وهدفك دون كشف أي معلومة</div>
            <div class="player-turn-header">الحدث السري لـ: ${player.name}</div>
            <div class="card-box">
                <div class="form-group">
                    <label>اختر بطاقاتك السرية:</label>
                    <select id="actionCard">
                        ${player.cards.map(c => `<option value="${c.id}">${c.name} - ${c.desc}</option>`).join('')}
                    </select>
                </div>
                <div class="form-group" style="margin-top:10px;">
                    <label>الهدف المستهدف:</label>
                    <select id="actionTarget">
                        ${otherPlayers.map(p => `<option value="${p.id}">${p.name}</option>`).join('')}
                    </select>
                </div>
                <button onclick="UI.handleExecuteAction()" style="margin-top:15px; width:100%;">تنفيذ الفعل بسرية</button>
            </div>
        `;
    },

    handleExecuteAction() {
        const player = GameState.players[GameState.activePlayerIndex];
        const cardId = document.getElementById('actionCard').value;
        const targetId = document.getElementById('actionTarget').value;

        const cardObj = CARDS.find(c => c.id === cardId);

        GameState.roundSecretActions.push({
            actorId: player.id,
            actionType: cardObj.type,
            cardId: cardId,
            targetId: targetId
        });

        GameState.activePlayerIndex++;
        if (GameState.activePlayerIndex >= GameState.players.length) {
            this.startPhaseAnalysis();
        } else {
            this.renderActionTurn();
        }
    },

    // PHASE 3: AI ANALYSIS & EVIDENCE ENGINE
    async startPhaseAnalysis() {
        GameState.phase = 'ANALYSIS';
        this.updateHeader();
        this.phaseContent.innerHTML = `
            <div style="text-align:center; padding:40px;">
                <h2>جاري تحليل الحالة وتوليد القضايا والأدلة...</h2>
                <p style="color:var(--text-muted); margin-top:10px;">الذكاء الاصطناعي يقوم بربط الحقائق المجردة وتوليد أدلة قابلة للحل دون كشف الأفعال.</p>
            </div>
        `;

        // Prepare RAW ABSTRACT DATA (Strictly No Prompt Templates/Examples)
        const rawPayload = {
            round: GameState.round,
            players: GameState.players.map(p => ({ id: p.id, name: p.name })),
            alliances: GameState.alliances,
            secretActions: GameState.roundSecretActions,
            persistentSecrets: GameState.persistentSecrets
        };

        const result = await callAIEngine(rawPayload);
        GameState.caseData = result;

        // Move secret actions into persistent logs
        GameState.persistentSecrets.push(...GameState.roundSecretActions);
        GameState.roundSecretActions = [];

        this.startPhaseDiscussion();
    },

    // PHASE 4: DISCUSSION & EVIDENCE DISPLAY
    startPhaseDiscussion() {
        GameState.phase = 'DISCUSSION';
        this.updateHeader();

        const caseData = GameState.caseData;

        let privateLeaksHTML = '';
        if (caseData.privateLeaks && caseData.privateLeaks.length > 0) {
            privateLeaksHTML = `
                <div class="card-box" style="margin-top:15px;">
                    <h3>تسريبات خاصة للاعبين (افتح تسريبك بسرية):</h3>
                    <div style="margin-top:10px;">
                        ${caseData.privateLeaks.map(leak => `
                            <details style="margin-bottom:8px; background:var(--bg-dark); padding:8px; border-radius:4px;">
                                <summary style="cursor:pointer; color:var(--primary); font-weight:bold;">تسريب خاص بـ: ${GameState.players.find(p=>p.id===leak.playerId)?.name || leak.playerId}</summary>
                                <p style="margin-top:6px; color:var(--text-main);">${leak.hint}</p>
                            </details>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        this.phaseContent.innerHTML = `
            <div class="card-box">
                <h2 style="color:var(--primary);">${caseData.title}</h2>
                <p style="margin-top:10px; font-size:1.05rem; line-height:1.6;">${caseData.publicEvidence}</p>
            </div>
            ${privateLeaksHTML}
            <div style="margin-top:20px; text-align:center;">
                <p style="color:var(--text-muted); margin-bottom:12px;">تناقشوا بناءً على الأدلة والتسريبات. لا يوجد كشف تلقائي للأفعال!</p>
                <button onclick="UI.startPhaseVoting()" style="width:100%; padding:14px; font-size:1.1rem;">الانتقال للتصويت السري</button>
            </div>
        `;
    },

    // PHASE 5: VOTING
    startPhaseVoting() {
        GameState.phase = 'VOTING';
        GameState.activePlayerIndex = 0;
        GameState.votes = {};
        this.renderVotingTurn();
    },

    renderVotingTurn() {
        this.updateHeader();
        const player = GameState.players[GameState.activePlayerIndex];
        const otherPlayers = GameState.players.filter(p => p.id !== player.id);

        this.phaseContent.innerHTML = `
            <div class="secret-banner">⚠️ تصويت سري فردي لـ (${player.name})</div>
            <div class="player-turn-header">صوت على المتهم الرئيسي بالقضية</div>
            <div class="card-box" style="margin-top:15px;">
                <div class="form-group">
                    <label>اختر اللاعب الذي تعتقد أنه خلف الشبهة:</label>
                    <select id="voteTarget">
                        ${otherPlayers.map(p => `<option value="${p.id}">${p.name}</option>`).join('')}
                    </select>
                </div>
                <button onclick="UI.handleCastVote()" style="margin-top:15px; width:100%;">تأكيد التصويت السري</button>
            </div>
        `;
    },

    handleCastVote() {
        const player = GameState.players[GameState.activePlayerIndex];
        const targetId = document.getElementById('voteTarget').value;

        GameState.votes[player.id] = targetId;

        GameState.activePlayerIndex++;
        if (GameState.activePlayerIndex >= GameState.players.length) {
            this.startPhaseResult();
        } else {
            this.renderVotingTurn();
        }
    },

    // PHASE 6: RESULT & ADVANCEMENT
    startPhaseResult() {
        GameState.phase = 'RESULT';
        this.updateHeader();

        // Tally Votes
        const tally = {};
        Object.values(GameState.votes).forEach(t => {
            tally[t] = (tally[t] || 0) + 1;
        });

        let maxVotes = 0;
        let accusedId = null;
        for (let t in tally) {
            if (tally[t] > maxVotes) {
                maxVotes = tally[t];
                accusedId = t;
            }
        }

        const accusedPlayer = GameState.players.find(p => p.id === accusedId);

        this.phaseContent.innerHTML = `
            <div class="card-box" style="text-align:center;">
                <h2>نتيجة قضية الجولة ${GameState.round}</h2>
                <p style="margin-top:15px; font-size:1.2rem;">
                    تم إدانة اللاعب: <strong style="color:var(--danger);">${accusedPlayer ? accusedPlayer.name : 'لا أحد (تعادل)'}</strong> بـ (${maxVotes}) أصوات.
                </p>
                <div style="margin-top:15px; background:var(--bg-dark); padding:12px; border-radius:6px; text-align:right;">
                    <strong>تفاصيل الأصوات:</strong>
                    ${Object.entries(GameState.votes).map(([voter, target]) => {
                        const vName = GameState.players.find(p=>p.id===voter)?.name;
                        const tName = GameState.players.find(p=>p.id===target)?.name;
                        return `<div class="vote-item"><span>${vName}</span> <span>صوّت ضد ➔ ${tName}</span></div>`;
                    }).join('')}
                </div>
                <p style="margin-top:15px; color:var(--text-muted); font-size:0.85rem;">
                    ملاحظة: الأفعال السرية والأحداث غير المكشوفة تظل مكتومة ومستمرة للجولات القادمة.
                </p>
            </div>
            <button onclick="UI.nextRound()" style="margin-top:15px; width:100%; padding:14px; font-size:1.1rem;">بدء الجولة التالية</button>
        `;
    },

    nextRound() {
        GameState.round++;
        GameState.privateMessages = [];
        GameState.alliances = [];
        this.startPhaseDiplomacy();
    }
};

// Initialize UI
window.addEventListener('DOMContentLoaded', () => UI.init());
</script>
</body>
</html>
