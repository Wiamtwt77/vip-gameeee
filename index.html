<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المحكمة السرية - الاستنتاج والدبلوماسية المعقدة</title>
    <style>
        :root {
            --bg-dark: #0a0c14;
            --bg-card: #141824;
            --bg-accent: #1d2338;
            --primary: #d4af37;
            --primary-hover: #f3c644;
            --danger: #e74c3c;
            --info: #3498db;
            --text-main: #ecf0f1;
            --text-muted: #8b95a5;
            --border: #28304a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 950px;
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
        }

        header {
            text-align: center;
            margin-bottom: 24px;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 16px;
        }

        h1 {
            color: var(--primary);
            font-size: 2.2rem;
            letter-spacing: 1px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 4px;
        }

        .hidden { display: none !important; }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 14px;
        }

        label {
            font-weight: bold;
            color: var(--primary);
            font-size: 0.95rem;
        }

        input, select, textarea, button {
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg-accent);
            color: var(--text-main);
            font-size: 0.95rem;
        }

        input:focus, select:focus, textarea:focus {
            outline: 2px solid var(--primary);
        }

        button {
            background: var(--primary);
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
        }

        button:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-accent);
            padding: 12px 18px;
            border-radius: 8px;
            font-weight: bold;
            border: 1px solid var(--border);
        }

        .badge {
            background: var(--primary);
            color: #000;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.85rem;
        }

        .card-box {
            background: var(--bg-accent);
            padding: 20px;
            border-radius: 8px;
            border-right: 4px solid var(--primary);
            margin-bottom: 16px;
        }

        .secret-banner {
            background: #2a1111;
            border: 1px solid var(--danger);
            color: #ff9999;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 16px;
            font-weight: bold;
        }

        .evidence-card {
            background: #0f1322;
            border: 1px solid #2d3859;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .evidence-card h4 {
            color: var(--primary);
            margin-bottom: 8px;
            border-bottom: 1px dashed var(--border);
            padding-bottom: 6px;
        }

        .leak-box {
            background: #121a2d;
            border: 1px solid var(--info);
            padding: 12px;
            border-radius: 6px;
            margin-top: 10px;
        }

        .vote-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            background: var(--bg-accent);
            border-radius: 6px;
            margin-bottom: 6px;
            border: 1px solid var(--border);
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: var(--primary);
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>المحكمة السرية</h1>
        <p class="subtitle">نظام الغموض الاستراتيجي - استنتاج الأدلة غير المباشرة والتضليل</p>
    </header>

    <!-- SETUP PANEL -->
    <div id="setupPanel">
        <div class="form-group">
            <label for="playerCount">عدد المشاركين في التشكيل (3 - 6):</label>
            <input type="number" id="playerCount" min="3" max="6" value="3">
        </div>
        <div id="playerInputs" class="form-group"></div>
        <button id="startBtn" style="width:100%; padding:14px; margin-top:10px;">بدء الجلسة السرية</button>
    </div>

    <!-- GAME PANEL -->
    <div id="gamePanel" class="hidden">
        <div class="status-bar" style="margin-bottom:20px;">
            <span>الجولة: <span id="roundNum">1</span></span>
            <span>المرحلة: <span id="phaseName" class="badge">-</span></span>
            <span>المكلف حالياً: <span id="activePlayer" style="color:var(--primary)">-</span></span>
        </div>

        <div id="phaseContent"></div>
    </div>
</div>

<script>
/**
 * CORE ENGINE & STATE MANAGEMENT
 */

const GameState = {
    round: 1,
    phase: 'DIPLOMACY',
    players: [],
    activePlayerIndex: 0,
    alliances: [], 
    privateMessages: [], 
    roundSecretActions: [], 
    persistentSecrets: [], 
    caseData: null, 
    votes: {},

    reset() {
        this.round = 1;
        this.phase = 'DIPLOMACY';
        this.players = [];
        this.activePlayerIndex = 0;
        this.alliances = [];
        this.privateMessages = [];
        this.roundSecretActions = [];
        this.persistentSecrets = [];
        this.caseData = null;
        this.votes = {};
    }
};

const CARDS = [
    { id: 'c1', name: 'تحقيق ظلي', type: 'INSPECT', desc: 'تتبع حركة المستندات السرية دون علم الهدف.' },
    { id: 'c2', name: 'تحالف مغلق', type: 'ALLIANCE', desc: 'تنسيق سري يمنع تسريب الاتصالات الرسمية.' },
    { id: 'c3', name: 'توجيه الشبهة', type: 'REDIRECT', desc: 'تزوير الآثار المادية لترتبط بطرف ثالث.' },
    { id: 'c4', name: 'عرقلة قرارات', type: 'SABOTAGE', desc: 'تجميد صلاحيات الهدف بشكل مستتر.' }
];

// SERVERLESS AI INTEGRATION WITH DYNAMIC ENGINE
async function callAIEngine(abstractPayload) {
    try {
        const response = await fetch('/api/game', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ rawData: abstractPayload })
        });
        if (!response.ok) throw new Error("Serverless Engine Error");
        return await response.json();
    } catch (err) {
        console.warn("API Call Fallback: Generating Dynamic Suspicion Matrix locally...", err);
        return generateDynamicLocalEngine(abstractPayload);
    }
}

// INTELLIGENT FALLBACK ENGINE (Zero Templates, Pure Multi-Suspect Logic)
function generateDynamicLocalEngine(data) {
    const players = data.players;
    const secrets = data.secretActions;
    const alliances = data.alliances;

    // Pick two potential suspects dynamically to create genuine conflict
    let suspectA = players[0];
    let suspectB = players[1] || players[0];

    if (secrets.length > 0) {
        const primary = secrets[0];
        const actor = players.find(p => p.id === primary.actorId);
        const target = players.find(p => p.id === primary.targetId);
        if (actor) suspectA = actor;
        if (target) suspectB = target;
    }

    return {
        title: `القضية ${data.round}: اضطراب في السجلات التنفيذية للمحكمة`,
        incidentOverview: `شهدت هذه الجولة تسريبات غير مصرح بها وتضارباً في التقارير الأمنية. تشير القرائن إلى وجود تحرك سري تقاطع بين عدة أطراف دون حتمية قاطعة.`,
        suspicionMatrix: [
            {
                suspectId: suspectA.id,
                suspectName: suspectA.name,
                circumstantialEvidence: `تم رصد بصمة توقيع تشبه النمط الخاص باللاعب (${suspectA.name}) على أحد مستندات الجلسة، لكن توقيت صدور الوثيقة يناقض موقعه المعلن.`
            },
            {
                suspectId: suspectB.id,
                suspectName: suspectB.name,
                circumstantialEvidence: `تلقى السجل المالي تحويلات غامضة تزامنت مع التحركات المنسوبة لـ (${suspectB.name})، مما يجعله طرفاً محتملاً في التوجيه.`
            }
        ],
        privateLeaks: players.map((p, idx) => {
            const other = players[(idx + 1) % players.length];
            return {
                playerId: p.id,
                hint: `معلومة سرية وصلت إليك: شوهدت مراسلات غير رسمية تخص (${other.name}) قد تتعارض مع ادعاءاته في جلسة النقاش.`
            };
        }),
        solvabilityEvaluation: {
            isSolvable: true,
            suspicionBalance: "متوازن (يوجد خياران منطقيان على الأقل)"
        }
    };
}

// UI CONTROLLER
const UI = {
    setupPanel: document.getElementById('setupPanel'),
    gamePanel: document.getElementById('gamePanel'),
    playerCountInput: document.getElementById('playerCount'),
    playerInputsDiv: document.getElementById('playerInputs'),
    startBtn: document.getElementById('startBtn'),
    phaseContent: document.getElementById('phaseContent'),

    init() {
        this.renderPlayerInputs();
        this.playerCountInput.addEventListener('change', () => this.renderPlayerInputs());
        this.startBtn.addEventListener('click', () => this.startGame());
    },

    renderPlayerInputs() {
        const count = parseInt(this.playerCountInput.value);
        this.playerInputsDiv.innerHTML = '';
        for (let i = 1; i <= count; i++) {
            this.playerInputsDiv.innerHTML += `
                <div class="form-group">
                    <label>اسم المشارك ${i}:</label>
                    <input type="text" class="player-name-input" value="عضو ${i}">
                </div>
            `;
        }
    },

    startGame() {
        GameState.reset();
        const inputs = document.querySelectorAll('.player-name-input');
        inputs.forEach((inp, idx) => {
            GameState.players.push({
                id: `p_${idx+1}`,
                name: inp.value.trim() || `عضو ${idx+1}`,
                cards: [...CARDS]
            });
        });

        this.setupPanel.classList.add('hidden');
        this.gamePanel.classList.remove('hidden');
        this.startPhaseDiplomacy();
    },

    updateHeader() {
        document.getElementById('roundNum').innerText = GameState.round;
        document.getElementById('phaseName').innerText = this.getPhaseArabic(GameState.phase);
        const currPlayer = GameState.players[GameState.activePlayerIndex];
        document.getElementById('activePlayer').innerText = currPlayer ? currPlayer.name : '-';
    },

    getPhaseArabic(p) {
        const map = {
            'DIPLOMACY': 'الدبلوماسية المكتومة',
            'ACTION': 'الأفعال السرية',
            'ANALYSIS': 'تحليل الأدلة والشبهات',
            'DISCUSSION': 'المداولة والتضليل',
            'VOTING': 'الاقتراع السري',
            'RESULT': 'الحكم النهائي'
        };
        return map[p] || p;
    },

    // PHASE 1: DIPLOMACY
    startPhaseDiplomacy() {
        GameState.phase = 'DIPLOMACY';
        GameState.activePlayerIndex = 0;
        this.renderDiplomacyTurn();
    },

    renderDiplomacyTurn() {
        this.updateHeader();
        const player = GameState.players[GameState.activePlayerIndex];
        const otherPlayers = GameState.players.filter(p => p.id !== player.id);

        this.phaseContent.innerHTML = `
            <div class="secret-banner">🛑 شاشة مغلقة خاصة بـ (${player.name}) - تأكد من عدم رؤية الآخرين</div>
            <div class="card-box">
                <h3>إرسال رسالة تكتيكية / عرض تحالف</h3>
                <p style="color:var(--text-muted); font-size:0.85rem; margin-top:4px; margin-bottom:12px;">
                    الرسائل قد تؤثر في تحليل الأدلة الشبهة دون كشف نصها المباشر.
                </p>
                <div class="form-group">
                    <label>الجهة المستهدفة:</label>
                    <select id="msgTarget">
                        ${otherPlayers.map(p => `<option value="${p.id}">${p.name}</option>`).join('')}
                    </select>
                </div>
                <div class="form-group">
                    <label>محتوى الرسالة الخاصة:</label>
                    <textarea id="msgText" rows="3" placeholder="اقترح اتفاقاً، أو وجه تحذيراً سرياً..."></textarea>
                </div>
                <button onclick="UI.handleSendDiplomacy()" style="width:100%;">إرسال الصفقة وتأكيد الدور</button>
            </div>
            <button onclick="UI.nextDiplomacyPlayer()" style="width:100%; background:transparent; border:1px solid var(--border); color:var(--text-muted);">إنهاء الدور بدون إرسال</button>
        `;
    },

    handleSendDiplomacy() {
        const player = GameState.players[GameState.activePlayerIndex];
        const targetId = document.getElementById('msgTarget').value;
        const text = document.getElementById('msgText').value.trim();

        if (text) {
            GameState.privateMessages.push({ from: player.id, to: targetId, text });
            GameState.alliances.push({ from: player.id, to: targetId });
        }
        this.nextDiplomacyPlayer();
    },

    nextDiplomacyPlayer() {
        GameState.activePlayerIndex++;
        if (GameState.activePlayerIndex >= GameState.players.length) {
            this.startPhaseAction();
        } else {
            this.renderDiplomacyTurn();
        }
    },

    // PHASE 2: SECRET ACTIONS
    startPhaseAction() {
        GameState.phase = 'ACTION';
        GameState.activePlayerIndex = 0;
        this.renderActionTurn();
    },

    renderActionTurn() {
        this.updateHeader();
        const player = GameState.players[GameState.activePlayerIndex];
        const otherPlayers = GameState.players.filter(p => p.id !== player.id);

        this.phaseContent.innerHTML = `
            <div class="secret-banner">🔒 السرية التامة: اختر إجراءك دون أن يتوقع الآخرون مسارك</div>
            <div class="card-box">
                <h3>تطبيق بطاقة سرية</h3>
                <div class="form-group" style="margin-top:10px;">
                    <label>البطاقات المتاحة:</label>
                    <select id="actionCard">
                        ${player.cards.map(c => `<option value="${c.id}">${c.name} — (${c.desc})</option>`).join('')}
                    </select>
                </div>
                <div class="form-group">
                    <label>الهدف المعني بالتأثير:</label>
                    <select id="actionTarget">
                        ${otherPlayers.map(p => `<option value="${p.id}">${p.name}</option>`).join('')}
                    </select>
                </div>
                <button onclick="UI.handleExecuteAction()" style="width:100%; margin-top:10px;">تسجيل الفعل بسرية مطلقة</button>
            </div>
        `;
    },

    handleExecuteAction() {
        const player = GameState.players[GameState.activePlayerIndex];
        const cardId = document.getElementById('actionCard').value;
        const targetId = document.getElementById('actionTarget').value;
        const cardObj = CARDS.find(c => c.id === cardId);

        GameState.roundSecretActions.push({
            actorId: player.id,
            actionType: cardObj.type,
            cardId: cardId,
            targetId: targetId
        });

        GameState.activePlayerIndex++;
        if (GameState.activePlayerIndex >= GameState.players.length) {
            this.startPhaseAnalysis();
        } else {
            this.renderActionTurn();
        }
    },

    // PHASE 3: AI ANALYSIS
    async startPhaseAnalysis() {
        GameState.phase = 'ANALYSIS';
        this.updateHeader();
        this.phaseContent.innerHTML = `
            <div style="text-align:center; padding:50px 20px;">
                <div class="spinner"></div>
                <h3 style="color:var(--primary); margin-top:15px;">محرك التحليل الاستراتيجي يعالج البيانات...</h3>
                <p style="color:var(--text-muted); font-size:0.9rem; margin-top:8px;">
                    يتم تحويل الأفعال السرية والمراسلات إلى مصفوفة أدلة تناقضية تعتمد الاستنتاج المزدوج.
                </p>
            </div>
        `;

        const rawPayload = {
            round: GameState.round,
            players: GameState.players.map(p => ({ id: p.id, name: p.name })),
            alliances: GameState.alliances,
            secretActions: GameState.roundSecretActions,
            persistentSecrets: GameState.persistentSecrets
        };

        const result = await callAIEngine(rawPayload);
        GameState.caseData = result;

        GameState.persistentSecrets.push(...GameState.roundSecretActions);
        GameState.roundSecretActions = [];

        this.startPhaseDiscussion();
    },

    // PHASE 4: DISCUSSION & EVIDENCES
    startPhaseDiscussion() {
        GameState.phase = 'DISCUSSION';
        this.updateHeader();

        const caseData = GameState.caseData;

        let matrixHTML = '';
        if (caseData.suspicionMatrix && caseData.suspicionMatrix.length > 0) {
            matrixHTML = caseData.suspicionMatrix.map(item => `
                <div class="evidence-card">
                    <h4>قرينة تحيط بـ: ${item.suspectName}</h4>
                    <p style="font-size:0.95rem; line-height:1.5;">${item.circumstantialEvidence}</p>
                </div>
            `).join('');
        }

        let privateLeaksHTML = '';
        if (caseData.privateLeaks && caseData.privateLeaks.length > 0) {
            privateLeaksHTML = `
                <div class="card-box" style="margin-top:20px;">
                    <h3>تسريبات تكتيكية خاصة (افتح عنصرك بشكل فردي):</h3>
                    <div style="margin-top:10px;">
                        ${caseData.privateLeaks.map(leak => {
                            const pName = GameState.players.find(p => p.id === leak.playerId)?.name || leak.playerId;
                            return `
                                <details style="margin-bottom:8px; background:var(--bg-dark); padding:10px; border-radius:6px; border:1px solid var(--border);">
                                    <summary style="cursor:pointer; color:var(--primary); font-weight:bold;">تسريب سري للمشارك: ${pName}</summary>
                                    <div class="leak-box">
                                        <p style="font-size:0.9rem;">${leak.hint}</p>
                                    </div>
                                </details>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        this.phaseContent.innerHTML = `
            <div class="card-box">
                <h2 style="color:var(--primary); margin-bottom:10px;">${caseData.title}</h2>
                <p style="font-size:1rem; line-height:1.6; color:var(--text-main); margin-bottom:16px;">
                    ${caseData.incidentOverview}
                </p>
                <h3 style="color:var(--primary); margin-bottom:12px; font-size:1.1rem;">مصفوفة الأدلة والشبهات المتقاطعة:</h3>
                ${matrixHTML}
            </div>
            ${privateLeaksHTML}
            <div style="margin-top:24px; text-align:center;">
                <button onclick="UI.startPhaseVoting()" style="width:100%; padding:14px; font-size:1.1rem;">الانتقال إلى جلسة الاقتراع والحكم</button>
            </div>
        `;
    },

    // PHASE 5: VOTING
    startPhaseVoting() {
        GameState.phase = 'VOTING';
        GameState.activePlayerIndex = 0;
        GameState.votes = {};
        this.renderVotingTurn();
    },

    renderVotingTurn() {
        this.updateHeader();
        const player = GameState.players[GameState.activePlayerIndex];
        const otherPlayers = GameState.players.filter(p => p.id !== player.id);

        this.phaseContent.innerHTML = `
            <div class="secret-banner">⚖️ تصويت سري خاص بـ (${player.name})</div>
            <div class="card-box">
                <h3>اصدار الصوت القضائي</h3>
                <div class="form-group" style="margin-top:12px;">
                    <label>اختر من ترى أنه المسئول بناءً على تقاطع الأدلة والتسريبات:</label>
                    <select id="voteTarget">
                        ${otherPlayers.map(p => `<option value="${p.id}">${p.name}</option>`).join('')}
                    </select>
                </div>
                <button onclick="UI.handleCastVote()" style="width:100%; margin-top:10px;">اعتماد الصوت السري</button>
            </div>
        `;
    },

    handleCastVote() {
        const player = GameState.players[GameState.activePlayerIndex];
        const targetId = document.getElementById('voteTarget').value;
        GameState.votes[player.id] = targetId;

        GameState.activePlayerIndex++;
        if (GameState.activePlayerIndex >= GameState.players.length) {
            this.startPhaseResult();
        } else {
            this.renderVotingTurn();
        }
    },

    // PHASE 6: RESULT
    startPhaseResult() {
        GameState.phase = 'RESULT';
        this.updateHeader();

        const tally = {};
        Object.values(GameState.votes).forEach(t => {
            tally[t] = (tally[t] || 0) + 1;
        });

        let maxVotes = 0;
        let accusedId = null;
        for (let t in tally) {
            if (tally[t] > maxVotes) {
                maxVotes = tally[t];
                accusedId = t;
            }
        }

        const accusedPlayer = GameState.players.find(p => p.id === accusedId);

        this.phaseContent.innerHTML = `
            <div class="card-box" style="text-align:center;">
                <h2>نتيجة المداولة - الجولة ${GameState.round}</h2>
                <p style="margin-top:16px; font-size:1.2rem;">
                    بناءً على الأغلبية، تم إدانة المشارك: 
                    <strong style="color:var(--danger);">${accusedPlayer ? accusedPlayer.name : 'لا أحد (تعادل بالأصوات)'}</strong> 
                    بواقع (${maxVotes}) أصوات.
                </p>
                <div style="margin-top:20px; text-align:right;">
                    <h4 style="color:var(--primary); margin-bottom:8px;">سجل أصوات الجلسة:</h4>
                    ${Object.entries(GameState.votes).map(([voter, target]) => {
                        const vName = GameState.players.find(p => p.id === voter)?.name;
                        const tName = GameState.players.find(p => p.id === target)?.name;
                        return `<div class="vote-item"><span>المشارك: ${vName}</span> <span>وجه التهمة إلى ➔ ${tName}</span></div>`;
                    }).join('')}
                </div>
                <p style="margin-top:16px; color:var(--text-muted); font-size:0.85rem;">
                    تنويه: الأفعال والتفاصيل السرية التي لم تكشفها الأدلة تظل مكتومة ومستمرة في السجل لتبنى عليها الجولات التالية.
                </p>
            </div>
            <button onclick="UI.nextRound()" style="width:100%; padding:14px; margin-top:10px; font-size:1.1rem;">الانتقال للجولة التالية</button>
        `;
    },

    nextRound() {
        GameState.round++;
        GameState.privateMessages = [];
        GameState.alliances = [];
        this.startPhaseDiplomacy();
    }
};

window.addEventListener('DOMContentLoaded', () => UI.init());
</script>
</body>
</html>
